# .github/workflows/ci.yml — CI del módulo nuevo de plantillas (templates2).
# Base: docs/rediseno-plantillas/diseno/06-pruebas-y-calidad.md §9 (ADR-026 + ADR-1R-C-12), copiado
# y ajustado al árbol real por el sub-agente 2-0a. Desviaciones frente a `06 §9` (todas registradas
# también en memoria/bitacora/2-0a.md y como ADR "propuesta" en memoria/decisiones.md):
#
#   1. Nombre de fichero: `ci.yml` (el brief de 2-0a lo pide así; `06 §9` proponía
#      `templates2-ci.yml` — mismo contenido, distinto nombre de fichero).
#   2. Ramas: `06 §9` apuntaba a `claude/agent-network-invitation-41nx5y` (rama de
#      memoria/brief-comun.md) + `main`. Se añade también la rama de trabajo real de ESTA fase,
#      `claude/fase-2-backend-orchestration-ksyuzi`, para que el CI corra en los PR/push de la
#      fase 2 sin esperar a que se cambie de rama.
#   3. Deriva del JSON Schema: `06 §9` comprobaba `packages/schema/dist/*.schema.json`. La ruta
#      contractual real (contratos.md §5, ADR-1R-D-08) es `packages/schema/json-schema/`, no
#      `dist/` — corregido aquí.
#   4. Job `e2e`: **NO OPERATIVO en esta fase** (`if: false` al nivel del job, más abajo). Referencia
#      `frontend/apps/web`, que no existe todavía — `apps/web` es de la fase 3 (contratos.md §1,
#      ADR-017). Los pasos se dejan completos y listos para que la fase 3 solo borre el `if: false`
#      cuando `apps/web` exista; no se inventa una app mínima para "hacerlo pasar" (eso ocultaría
#      que no hay nada real que probar).
#   5. El job `backend` asume que `jacocoTestReport`/`jacocoTestCoverageVerification` (06 §2.1) ya
#      están configurados en build.gradle.kts. **2-0a NO los añade** (fuera de su alcance: "no
#      añadas dependencias al build.gradle.kts... las añade 2-0b"), así que este job **fallará**
#      hasta que 2-0b los configure — es el comportamiento correcto (P9: sin pruebas no se integra),
#      no un error de este YAML.
#   6. `NODE_VERSION`/`PNPM_VERSION` fijados a las versiones verificadas en este entorno
#      (contratos.md §7: Node 22.22.2, pnpm 10.33.0), no a los valores de ejemplo de `06 §9`.
#   7. El job `backend` corre `check` (objeción ADV-16 del cierre de la fase 2, bloque 2-6). La orden
#      de `contratos.md §6` es `test jacocoTestReport jacocoTestCoverageVerification`, y con ella
#      `verifyJsonSchemaEmitted` —enganchada a `check` en build.gradle.kts:265-268 y exigida por
#      `contratos.md §5`— no se ejecutaba en CI. `check` es superconjunto de `test`, así que el
#      efecto de la orden contractual se conserva íntegro. Como `verifyJsonSchemaEmitted` reemite el
#      esquema con `pnpm`, este job instala ahora Node/pnpm y las dependencias de `frontend/`.
#
# CI no se ha ejecutado (ni puede ejecutarse) desde esta sesión: no hay `gh`/push a GitHub. La
# validación hecha aquí es sintáctica (yaml.safe_load) y de lectura, no una corrida real — ver
# memoria/bitacora/2-0a.md.
name: templates2-ci

on:
  # `06 §9` traía `pull_request.branches: [claude/agent-network-invitation-41nx5y, main]`. La versión
  # entregada por 2-0a lo había reducido a `[main]`, contradiciendo su propia nota 2 de cabecera
  # ("se AÑADE la rama de la fase 2"): un PR contra la rama contractual de trabajo (contratos.md §1)
  # no habría disparado CI. Restaurado y ampliado (revisión 2-0a-REV, objeción O-05).
  # Bloque 3-6: se añade la rama de trabajo REAL de la fase 3 — sin ella, un PR/push contra
  # `claude/fase-3-frontend-orchestration-yuh8sx` (la que existe de verdad en este repositorio hoy)
  # nunca dispara este workflow, exactamente el mismo defecto que la objeción O-05 de 2-0a-REV ya
  # había corregido una vez para la rama de la fase 2.
  # Tarea «CI real en GitHub» (esta rama): el workflow nunca se habia ejecutado en GitHub. Se
  # anaden los disparadores que pide el encargo — `pull_request` hacia `main` y `push` a la rama de
  # trabajo de esta tarea — y `workflow_dispatch` para poder relanzar una ejecucion sin commit vacio.
  pull_request:
    branches:
      [main, claude/agent-network-invitation-41nx5y, claude/fase-2-backend-orchestration-ksyuzi, claude/fase-3-frontend-orchestration-yuh8sx]
  push:
    branches:
      [main, claude/agent-network-invitation-41nx5y, claude/fase-2-backend-orchestration-ksyuzi, claude/fase-3-frontend-orchestration-yuh8sx, claude/ci-github-actions, claude/ci-github-actions-jobs-9qyd9z]
  workflow_dispatch:

concurrency:
  group: templates2-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"          # toolchain 21 (handoffs/0-build-jdk.md; build.gradle.kts actualizado por 2-0a)
  NODE_VERSION: "22.22.2"     # contratos.md §7 (entorno verificado)
  PNPM_VERSION: "10.33.0"     # contratos.md §7 (entorno verificado)

jobs:
  backend:
    name: backend (JDK 21 + Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:                                  # 06 §6.3: el runner tiene Docker; en local se usa scripts/pg-ephemeral.sh
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: templates2_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle con caché
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - run: chmod +x gradlew

      # `check` en vez de `test` (objeción ADV-16 de la revisión adversarial global). `check` es un
      # superconjunto estricto de la orden literal de `contratos.md §6`
      # (`test jacocoTestReport jacocoTestCoverageVerification`): build.gradle.kts engancha a `check`
      # tanto `jacocoTestCoverageVerification` como **`verifyJsonSchemaEmitted`**, la compuerta de
      # deriva del JSON Schema del lado Kotlin (contratos.md §5). Con `test` a secas esa compuerta no
      # se ejecutaba NUNCA en CI. Se dejan las dos tareas de JaCoCo explícitas para que la orden siga
      # conteniendo, palabra por palabra, la de `contratos.md §6`.
      # `verifyJsonSchemaEmitted` necesita `pnpm` en el PATH y `pnpm install` hecho en frontend/: si
      # falta, falla con instrucciones y NO se salta en silencio (build.gradle.kts:225).
      - name: Node + pnpm (los necesita verifyJsonSchemaEmitted, contratos.md §5)
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Dependencias del frontend (solo para reemitir el esquema)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: check + cobertura (06 §2.1 y §5 — incluye verifyJsonSchemaEmitted, ver nota 7 de cabecera)
        run: ./gradlew --no-daemon check jacocoTestReport jacocoTestCoverageVerification
        env:
          TPL_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:55432/templates2_test
          TPL_TEST_DB_USER: postgres
          TPL_TEST_DB_PASSWORD: postgres

      - name: Informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            build/reports/tests/test/**
            build/reports/jacoco/test/**
          retention-days: 7

  frontend:
    name: frontend (Node 22 + pnpm) — packages/schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Deriva del JSON Schema (ADR-004; ruta corregida a json-schema/, ver nota 3 de cabecera)
        run: |
          pnpm --filter @invitaciones/schema run schema:emit
          git diff --exit-code -- packages/schema/json-schema

      # ADR-1R-D-09 ("golden files generados, nunca escritos a mano") no tenía NINGUNA compuerta
      # mecánica: sin este paso, un golden editado a mano pasaba el CI sin que nadie lo notara, y la
      # promesa de golden/README.md ("regenerar debe dar exactamente estos ficheros") no la
      # comprobaba nadie. `gen:golden` es determinista — verificado ejecutándolo dos veces seguidas
      # y comparando sha256 de los 71 ficheros: 0 diferencias (revisión 2-0a-REV, objeción O-04).
      - name: Deriva de los golden files (ADR-1R-D-09)
        run: |
          pnpm --filter @invitaciones/schema run gen:golden
          git diff --exit-code -- packages/schema/golden
          test -z "$(git ls-files --others --exclude-standard -- packages/schema/golden)" \
            || { echo "gen:golden creó ficheros no versionados en packages/schema/golden"; \
                 git ls-files --others --exclude-standard -- packages/schema/golden; exit 1; }

      - name: Lint (incluye la regla de ADR-005, 06 §7 — placeholder hasta que fase 3 configure ESLint)
        run: pnpm -r lint

      - name: Tipos
        run: pnpm -r typecheck

      - name: Pruebas + cobertura (06 §2.2)
        run: pnpm -r exec vitest run --coverage

      - name: Inventario de golden files (06 §3)
        run: pnpm --filter @invitaciones/schema exec vitest run golden-inventory

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/**/coverage/**
          retention-days: 7

  e2e:
    name: e2e (Playwright/Chromium)
    # `apps/web` existe desde el bloque 3-1 (contratos.md §1, ADR-017): el `if: false` de la fase 2
    # queda retirado aquí. Ajustes MÍNIMOS respecto a la versión de la fase 2 (memoria/bitacora/3-1.md):
    #   - Puerto del backend: 6003 (application.yml:2), no 8080 — no hay actuator expuesto
    #     (`/actuator/health` da 401, `anyRequest().authenticated()`); la sonda pasa a
    #     `GET /public/i/sonda/exists`, la misma que usa `scripts/dev-backend.sh` (permitAll, siempre
    #     responde 2xx sin importar el token).
    #   - Rol `evolution`, entorno de assets, webhook de revalidación y recorte de Mongo: todo eso
    #     vive ahora en `scripts/ci-backend.sh` (tarea «CI real en GitHub»), que además ESPERA de
    #     verdad al arranque y falla con el log a la vista — ver la cabecera de ese script.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      # En el runner NO existe /opt/pw-browsers: los navegadores se instalan y se cachean aquí.
      # En el entorno local de desarrollo esta variable ya apunta a /opt/pw-browsers y NO
      # debe ejecutarse `playwright install` (contratos.md §7).
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      # `playwright.config.ts` y `playwright.design.config.ts` ya leen esta variable: si el binario
      # existe, lo usan como `executablePath`. Es lo que iguala el motor de render del runner al del
      # entorno donde se generaron las capturas de referencia.
      PW_CHROMIUM_PATH: ${{ github.workspace }}/.pw-browsers/chromium-1194/chrome-linux/chrome
      CI: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: templates2_e2e
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Sin esto el job se descargaba TODA la caché de dependencias de Gradle en cada corrida antes
      # de poder compilar el backend: el mismo `setup-gradle` que ya usa el job `backend`.
      - name: Gradle con caché
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Caché de navegadores
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: pw1194-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # DIVERGENCIA REAL runner/local, corregida aquí (handoffs/ci-github.md §1):
      #   a) `pnpm exec playwright` desde `frontend/` NO resuelve nada: `@playwright/test` es
      #      dependencia de `apps/web`, no de la raíz del monorepo. En local colaba porque hay un
      #      `playwright` global en el PATH del contenedor; en el runner el paso moría en 0 s
      #      («playwright: not found») y con él TODO el job. Va con `--filter web`.
      #   b) Las 124 capturas de referencia de la galería se generaron con el Chromium
      #      **revisión 1194** (141.0.7390.37) que este proyecto usa en local por `executablePath`
      #      (`playwright.config.ts`), no con el 1234 que instalaría `@playwright/test@1.62.1`.
      #      Comparar píxeles entre dos versiones de Chrome distintas no prueba nada: se instala la
      #      MISMA revisión 1194 —`playwright-core@1.56.0` es la que la fija— y se apunta ahí con
      #      `PW_CHROMIUM_PATH`, la variable que la propia config ya lee. Las dependencias del
      #      sistema y `ffmpeg` (obligatorio: `video: retain-on-failure` graba SIEMPRE) los pone el
      #      Playwright pineado del proyecto.
      # Las dependencias APT del sistema van SIEMPRE (viven en la imagen del runner, no en la caché
      # de navegadores); el navegador y ffmpeg solo cuando la caché no acertó.
      - name: Dependencias del sistema para Chromium
        run: pnpm --filter web exec playwright install-deps chromium
      - name: "ffmpeg (obligatorio; `video: retain-on-failure` graba en TODAS las pruebas)"
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install ffmpeg
      - name: Chromium 1194 — la MISMA revisión con la que se hicieron las capturas de referencia
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx --yes playwright-core@1.56.0 install chromium

      - name: Backend por script (Postgres del servicio, assets locales, webhook cableado)
        working-directory: .
        run: scripts/ci-backend.sh
        env:
          TPL_CI_PGPORT: "55432"
          TPL_CI_DB: templates2_e2e
          TEMPLATES2_ASSETS_BUCKET: templates2-ci-e2e
          TEMPLATES2_ASSETS_MODE: local
          TEMPLATES2_ASSETS_LOCAL_DIR: ${{ github.workspace }}/build/templates2-assets

      # Bloque 3-6 — GAP CRÍTICO cerrado: hasta aquí NINGUNA prueba de este archivo podía correr,
      # porque el job arranca un backend VACÍO (Flyway sin datos: cero plantillas registradas, cero
      # cuenta de demostración). Las e2e de `frontend/apps/web/e2e/**` dependen TODAS, directa o
      # indirectamente, de `scripts/seed-demo.sh` (cuenta `demo.boda@example.com`, las dos plantillas
      # registradas, una invitación publicada) — sin él, el primer `POST /auth/token` de
      # `e2e/global-setup.ts` respondería 401. `scripts/seed-demo.sh` NO se edita: se le da el mismo
      # `state.env` que ya lee para encontrar el puerto de Postgres —aquí no hay `pg-ephemeral.sh`,
      # CI usa el servicio `postgres:` de arriba, puerto fijo 55432— y el `PGPASSWORD` que sus
      # llamadas a `psql` necesitan contra un servidor con contraseña.
      # `TPL_TEST_PGBIN`: en el runner `psql` está en /usr/bin (envoltorio de postgresql-common), no
      # en /usr/lib/postgresql/16/bin, que es el defecto del script (divergencia runner/local).
      - name: Sembrar demo (cuenta, plantillas registradas, invitación publicada)
        working-directory: .
        run: |
          mkdir -p /tmp/templates2-pg
          echo "TPL_TEST_PGPORT=55432" > /tmp/templates2-pg/state.env
          TPL_TEST_PGBIN="$(dirname "$(command -v psql)")" bash scripts/seed-demo.sh
        env:
          TPL_DEV_BASE: http://127.0.0.1:6003
          TPL_DEV_DB: templates2_e2e
          PGPASSWORD: postgres

      # El servidor web del frontend lo arranca Playwright (`webServer` de playwright.config.ts),
      # NO un `&` suelto en este paso: un proceso lanzado con `&` en un step muere al terminarlo.
      #
      # Dos invocaciones a propósito (política anti-flake, `06 §8.2` / ADR-1R-C-11): `a11y-publico`
      # es el único spec que flakea en paralelo (`handoffs/3c-para-siguiente.md`), así que corre
      # aparte con `--workers=1` y el resto conserva los 4 workers de la config. No es cuarentena:
      # el spec SE EJECUTA y su fallo rompe el job igual que cualquier otro (`--fail-on-flaky-tests`
      # en ambas). Queda anotado como issue en `memoria/issues-ci.md` (I-CI-01).
      - name: e2e + a11y (4 workers, todos los specs menos a11y-publico)
        run: pnpm --filter web exec playwright test --fail-on-flaky-tests '^(?!.*a11y-publico\.spec\.ts).*$'

      - name: a11y del render público con un solo worker (I-CI-01)
        run: pnpm --filter web exec playwright test --fail-on-flaky-tests --workers=1 a11y-publico.spec.ts

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/apps/web/playwright-report/**
            frontend/apps/web/test-results/**
          retention-days: 7

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-log
          path: build/dev/backend-e2e.log
          retention-days: 7

      # Bloque 3-6 — compuerta (b) de `04 §16.2` (LCP y el resto de Core Web Vitals).
      # `lighthouserc.cjs` (bloque 3-3) descubre la URL publicada por la API real, así que solo hace
      # falta apuntarlo a un Chrome real: el mismo Chromium 1194 que instaló el paso de arriba.
      - name: LCP y Core Web Vitals (LHCI, 04 §16.2)
        working-directory: frontend/apps/web
        run: |
          CHROME_PATH="$PLAYWRIGHT_BROWSERS_PATH/chromium-1194/chrome-linux/chrome"
          echo "CHROME_PATH=$CHROME_PATH"
          test -x "$CHROME_PATH" || { echo "No encuentro el Chromium 1194 en $PLAYWRIGHT_BROWSERS_PATH"; exit 1; }
          CHROME_PATH="$CHROME_PATH" npx lhci autorun --config=./lighthouserc.cjs

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-reports
          path: frontend/apps/web/.lighthouseci/**
          retention-days: 7

  # ── Galería de diseño ───────────────────────────────────────────────────────────────────────────
  # Fase 3-C, bloque 2 (F3): regresión visual, contraste y axe de `/design` (279 pruebas). Estaba
  # como UN PASO MÁS del job `e2e`, y ahí sumaba su propio `next build` + sus 279 pruebas a un job
  # que ya compilaba el backend, sembraba y corría las e2e con backend real: el objetivo de < 25 min
  # de reloj del encargo no cabía. Se saca a un job propio —autorizado expresamente («si no llega,
  # paraleliza jobs… nunca recortes pruebas»)— porque NO toca el backend en absoluto: ni Postgres ni
  # `seed-demo.sh`; tiene su propia config sin `globalSetup` y su propio `webServer` en el 3133
  # (`playwright.design.config.ts`). Ni una sola prueba deja de ejecutarse: cambian de job, no
  # desaparecen.
  design:
    name: galería de diseño (regresión visual + contraste + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      # `playwright.config.ts` y `playwright.design.config.ts` ya leen esta variable: si el binario
      # existe, lo usan como `executablePath`. Es lo que iguala el motor de render del runner al del
      # entorno donde se generaron las capturas de referencia.
      PW_CHROMIUM_PATH: ${{ github.workspace }}/.pw-browsers/chromium-1194/chrome-linux/chrome
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Caché de navegadores
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: pw1194-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # Las dependencias APT del sistema van SIEMPRE (viven en la imagen del runner, no en la caché
      # de navegadores); el navegador y ffmpeg solo cuando la caché no acertó.
      - name: Dependencias del sistema para Chromium
        run: pnpm --filter web exec playwright install-deps chromium
      - name: "ffmpeg (obligatorio; `video: retain-on-failure` graba en TODAS las pruebas)"
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install ffmpeg
      - name: Chromium 1194 — la MISMA revisión con la que se hicieron las capturas de referencia
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx --yes playwright-core@1.56.0 install chromium

      - name: e2e de la galería de diseño (regresión visual, contraste y axe)
        run: pnpm --filter web exec playwright test --config=playwright.design.config.ts --fail-on-flaky-tests

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-report
          path: |
            frontend/apps/web/playwright-report/**
            frontend/apps/web/test-results/**
          retention-days: 7
