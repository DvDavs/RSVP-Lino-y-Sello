server:
  port: 6003
  error:
    whitelabel:
      enabled: false
    include-message: always
invitaciones:
  jwt:
    # SIN VALOR POR DEFECTO A PROPOSITO (ADR-5-E3-A3-01; hallazgo S-01 de `diseno/12 A3`).
    # Esta clave firma los tokens de TODAS las sesiones: con un valor escrito aqui, cualquiera con
    # acceso al repositorio (o a su historico) firma un token valido para cualquier usuario y
    # cualquier rol, MASTER incluido, sin credenciales y sin dejar rastro. Sin `JWT_SECRET` la
    # aplicacion NO arranca y explica que poner (`core/config/SecretosObligatorios.kt`).
    # Tampoco se genera una al vuelo: una clave distinta por instancia invalidaria en silencio
    # todas las sesiones vivas en cada reinicio, que es peor que no arrancar.
    # Minimo 32 caracteres: `JwtUtil.kt:18` la usa tal cual como clave HMAC de HS256.
    secret: ${JWT_SECRET}
    issuer: evolutiondevmx
    expiration: 3600000
aws:
  region: us-east-2
  credentials:
    # SIN VALOR POR DEFECTO A PROPOSITO (ADR-5-E3-A3-01; S-01). Son las credenciales de la cuenta de
    # AWS: quien las tiene escribe y borra en los buckets del producto. Los nombres son los estandar
    # del SDK de AWS, asi que el mismo entorno sirve para `aws-cli` y para la cadena de proveedores
    # por defecto. Sin ellas la aplicacion NO arranca y explica que poner.
    # Para desarrollo, `scripts/dev-backend.sh` define un par evidentemente falso y trabaja con
    # `TEMPLATES2_ASSETS_MODE=local`, que no llama a AWS.
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
spring:
  application:
    name: Invitaciones
  datasource:
    driver-class-name: org.postgresql.Driver
    # Estos dos SI conservan valor por defecto, a diferencia de los secretos de arriba
    # (ADR-5-E3-A3-01): son las credenciales del Postgres de DESARROLLO que crean
    # `scripts/pg-ephemeral.sh` y `docker-compose.yml` en la propia maquina, no una cuenta de
    # produccion. Un despliegue real las trae del entorno y ese Postgres no acepta estas.
    password: ${SPRING_DATASOURCE_PASSWORD:evolution123}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5501/invitaciones}
    username: ${SPRING_DATASOURCE_USERNAME:evolution}
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    # R3-02. Estaba en `true` fijo, y este es el UNICO application.yml del repositorio: cualquier
    # despliegue volcaba en el registro todas las sentencias que ejecuta la aplicacion. Apagado por
    # defecto y disponible en desarrollo con `SPRING_JPA_SHOW_SQL=true`.
    # Ojo con lo que apaga y lo que no: esto imprime el SQL, con `?` en los parametros; quien
    # imprimia los VALORES —el token de verificacion, el de recuperacion y el hash de la
    # contrasena— es el nivel de `org.hibernate` (ver `logging.level`, al final del fichero).
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    sql-migration-prefix: V
    sql-migration-separator: __
    sql-migration-suffixes: .sql
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://evolution:evolution123@localhost:27017/invitaciones?authSource=admin}
  servlet:
    multipart:
      # templates2 (contratos.md 4, 03 3.17): POST /master/templates2/versions es la UNICA ruta
      # multipart del modulo y sube el paquete de una plantilla (hasta 200 assets de 15 MiB).
      # Es la unica modificacion de este fichero que pide el modulo nuevo.
      max-file-size: 15MB
      max-request-size: 64MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  web:
    resources:
      add-mappings: false
  mail:
    # DESDE ADR-5-E3-A4-01 ESTE BLOQUE ES LA UNICA FUENTE DEL TRANSPORTE SMTP. Antes no lo era:
    # `core/email/MailConfig.kt` definia un `@Bean @Primary JavaMailSender` con el servidor, el
    # puerto, la cuenta y la contrasena de aplicacion ESCRITOS EN EL CODIGO Kotlin. Al ser `@Primary`
    # apagaba `MailSenderAutoConfiguration` (que es `@ConditionalOnMissingBean(MailSender)`), asi que
    # el correo real no leia NADA de aqui y externalizar estas dos propiedades era cosmetico. Ese
    # fichero ya no existe y el `JavaMailSender` lo construye Spring Boot con lo que hay debajo:
    # todo lo que fijaba el codigo esta ahora escrito aqui y quitar cualquier linea CAMBIA el envio.
    host: smtp.gmail.com
    port: 465
    protocol: smtp
    # SIN VALOR POR DEFECTO A PROPOSITO (ADR-5-E3-A3-01; S-01). Es la cuenta y la contrasena de
    # aplicacion del buzon que manda TODO el correo transaccional: quien las tiene escribe correo
    # como la empresa y lee el buzon donde caen los enlaces de recuperacion de contrasena.
    # Sin ellas la aplicacion NO arranca y explica que poner (`core/config/SecretosObligatorios.kt`).
    # `MAIL_USERNAME` es ademas el remitente: `core/email/strategy/GoogleSmtpStrategy.kt` lo inyecta
    # con `@Value` sobre `spring.mail.username` para la cabecera `From`. Hasta ADR-5-E3-A4-01 el
    # remitente salia de aqui y la autenticacion del servidor de otro sitio: podian no coincidir.
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    # NOTACION DE CORCHETES A PROPOSITO, no es un capricho de estilo. `spring.mail.properties` se
    # enlaza a un `Map<String, String>` y Spring Boot canonicaliza las claves de los mapas a
    # minusculas salvo que vayan entre corchetes; los nombres de JavaMail son SENSIBLES A MAYUSCULAS,
    # asi que en forma anidada `socketFactory` llegaria como `socketfactory` y JavaMail lo ignoraria
    # en silencio: SSL sin fabrica de sockets explicita. Con corchetes la clave viaja literal.
    # `MailSenderConfiguracionTest` comprueba los nombres exactos que se producen desde ESTE fichero.
    properties:
      "[mail.transport.protocol]": smtp
      "[mail.smtp.auth]": true
      # SSL directo contra el 465 (SMTPS), no STARTTLS sobre el 587. Las cinco lineas siguientes van
      # juntas y las cinco venian del codigo. `socketFactory.fallback: false` es deliberado: con
      # `true`, si falla el canal SSL, JavaMail reintenta en claro y la contrasena viaja sin cifrar.
      "[mail.smtp.starttls.enable]": false
      "[mail.smtp.ssl.enable]": true
      "[mail.smtp.socketFactory.port]": 465
      "[mail.smtp.socketFactory.class]": javax.net.ssl.SSLSocketFactory
      "[mail.smtp.socketFactory.fallback]": false
      # ESTABA EN `true` Y ERA INOFENSIVO solo porque el `@Primary` ignoraba este bloque entero. Ahora
      # se aplicaria de verdad y volcaria a la salida estandar la conversacion SMTP completa, incluida
      # la linea `AUTH` con la credencial en base64: los registros del servidor pasarian a ser un
      # sitio mas donde vive el secreto. Se queda en `false` (ADR-5-E3-A4-01).
      "[mail.smtp.debug]": false
email:
  provider: google # Options: google, mailersend
app:
  frontend:
    url: ${FRONTEND_URL:http://localhost} # URL del frontend para enlaces de correo
mailersend:
  apiToken: ${MAILERSEND_API_TOKEN:Api_Token_Here}
  fromEmail: ${MAILERSEND_FROM_EMAIL:info@domain.com}
  fromName: ${MAILERSEND_FROM_NAME:Invitaciones}
whatsapp:
  # WhatsApp NO ES UN SECRETO OBLIGATORIO, a diferencia del JWT, AWS y el correo (ADR-5-E3-C3-01;
  # hallazgo S-01 de `diseno/12-producto-completo.md A3`). Aqui vale la convencion que este mismo
  # fichero ya usa para Stripe y para templates2.revalidate: VACIO = FUNCION DESACTIVADA, no "usa el
  # valor de siempre". Motivo: hoy WhatsApp es SOLO click-to-chat (`decisiones-dueno.md` D-04,
  # ADR-DUENO-02); no hay envio automatico y la API de Meta se decide mas adelante. Exigir estos dos
  # tokens para arrancar romperia todo despliegue que no los necesita y empujaria al operador a
  # inventarse un valor, que es justo el defecto que ADR-5-E3-A3-01 vino a quitar. Sin ellos el
  # modulo se apaga: `/api/whatsapp/send-masivo` y `/webhook` responden 503 con un cuerpo honesto
  # (`modules/shared/whatsapp/WhatsAppConfiguracion.kt`), nunca un 500 ni una llamada a Meta.
  api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v19.0}
  # NO es un secreto: es el identificador publico del numero dentro de la URL de Meta Graph. Se
  # externaliza solo para que un despliegue pueda apuntar a otro numero sin tocar el codigo.
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  # SECRETO. Estaba ESCRITO EN CLARO en esta linea hasta ADR-5-E3-C3-01. Con el, cualquiera manda
  # WhatsApp desde el numero de la empresa (hallazgo S-06, pasarela abierta). Sacarlo de aqui NO lo
  # invalida: sigue en el historico de git y sigue siendo valido hasta que el dueno lo ROTE en Meta.
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  webhook:
    # SECRETO. Estaba escrito en el codigo (`WhatsAppWebhookController.kt:13`) hasta ADR-5-E3-C3-01.
    # Es el `hub.verify_token` del alta del webhook en Meta. VACIO = el webhook no se da de alta:
    # la verificacion responde 503 y NUNCA compara contra una cadena vacia.
    verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}

# templates2 (contratos.md 8, ADR-1R-F-09; anadido por el bloque 2-6, ADR-2-6-01). Invalidacion de la
# cache del render publico tras publicar, despublicar o rotar el enlace: el backend hace
# POST {url} con la cabecera x-revalidate-token y el handler de Next.js ejecuta
# revalidateTag("invitation:{publicToken}").
# VACIAS = FUNCION DESACTIVADA: sin url y sin token no se llama a nadie y el borde se corrige solo con
# el max-age de 300 s. No se pone un host por defecto a proposito (app.frontend.url vale
# http://localhost por defecto y mandar un token a un host adivinado es peor que no llamar).
# El token sale de la variable de entorno; NUNCA se escribe aqui ni en un log.
# Es la SEGUNDA modificacion de este fichero que pide el modulo nuevo, tras spring.servlet.multipart
# (contratos.md 4 decia "unica"); la enmienda queda registrada como ADR-2-6-01.
templates2:
  assets:
    # OBLIGATORIA y SIN VALOR POR DEFECTO a proposito (ADR-2-ORQ-03).
    # El unico defecto natural seria 'invitacionesdigitalesassets', que es el bucket de PRODUCCION,
    # y un bucket de produccion no puede ser el valor que se aplica cuando nadie ha pensado en ello.
    # Sin esta propiedad la aplicacion NO arranca y explica que poner. Para desarrollo y pruebas,
    # define un bucket propio:  TEMPLATES2_ASSETS_BUCKET=mi-bucket-de-pruebas
    bucket: ${TEMPLATES2_ASSETS_BUCKET:}
    # Escribir en el bucket de produccion exige declararlo explicitamente.
    allow-production-bucket: ${TEMPLATES2_ALLOW_PRODUCTION_BUCKET:false}
    # --- TERCERA modificacion de este fichero que pide el modulo nuevo (bloque 3-0a, ADR-3-0a-02) ---
    # Adaptador de assets. 's3' es el comportamiento de siempre y el valor por defecto: sin tocar
    # nada, este bloque NO cambia como se comporta la aplicacion. Con 'local' (solo DESARROLLO) los
    # bytes se escriben en disco y se sirven desde el propio backend, porque en el entorno de la
    # fase 3 no hay ningun bucket de S3 utilizable y sin esto las rutas que suben bytes no se pueden
    # ejercitar contra un Tomcat real. Con un perfil de produccion activo, 'local' NO ARRANCA.
    mode: ${TEMPLATES2_ASSETS_MODE:s3}
    local:
      # Directorio raiz del modo local; reproduce la clave de S3 tal cual.
      dir: ${TEMPLATES2_ASSETS_LOCAL_DIR:build/templates2-assets}
      # Base publica desde la que el propio backend sirve esos bytes (ruta de solo lectura).
      base-url: ${TEMPLATES2_ASSETS_LOCAL_BASE_URL:http://localhost:6003/public/templates2-assets}
    # Base publica con la que `AssetUrlResolver` construye la URL de un asset (`02 §10.4`).
    # VACIA = el comportamiento de siempre: https://{bucket}.s3.{aws.region}.amazonaws.com.
    # En modo local hay que apuntarla a `local.base-url` (lo hace scripts/dev-backend.sh).
    public-base-url: ${TEMPLATES2_ASSETS_PUBLIC_BASE_URL:}
  revalidate:
    url: ${TEMPLATES2_REVALIDATE_URL:}
    token: ${TEMPLATES2_REVALIDATE_TOKEN:}
    timeout-ms: ${TEMPLATES2_REVALIDATE_TIMEOUT_MS:3000}
logging:
  # R3-02 (`bitacora/5-E3-R3-verificacion.md` §4). `org.hibernate: debug` mas `show-sql: true`
  # dejaban el registro de CUALQUIER despliegue lleno de material sensible: con DEBUG, Hibernate
  # imprime cada entidad que carga o descarga (`EntityPrinter`) y cada parametro que enlaza o
  # extrae (`org.hibernate.orm.jdbc.bind` / `.extract`), asi que el registro acababa conteniendo el
  # token de verificacion de correo en claro, el de recuperacion, el hash bcrypt y los datos
  # personales de las clientas. Quien lee los registros —operacion, un agregador, un servicio de
  # errores— se quedaba con cualquier cuenta que tuviera una verificacion o una recuperacion en
  # curso.
  #
  # Que se apaga y que no: NO se apaga el registro de la aplicacion (`root: info` sigue igual, y
  # los avisos de Hibernate tambien: `info` deja pasar el arranque, el dialecto y los WARN/ERROR).
  # Lo que se apaga es exactamente lo que vuelca datos.
  #
  # Como se enciende en desarrollo, y solo ahi (nunca por defecto):
  #   SPRING_JPA_SHOW_SQL=true        -> las sentencias, con `?` en lugar de los valores
  #   LOG_HIBERNATE=debug             -> el DEBUG de Hibernate (sentencias y plan), SIN valores
  #   LOG_HIBERNATE_PARAMETROS=trace  -> los valores enlazados y extraidos (TRACE es su nivel real)
  #   LOG_HIBERNATE_ENTIDADES=debug   -> el volcado de la entidad entera; necesita ADEMAS
  #                                      LOG_HIBERNATE=debug, porque quien llama a `EntityPrinter`
  #                                      es el listener de flush y ese va bajo `org.hibernate`
  # Comprobado contra un backend real (bitacora/5-E3-C5.md §4): con LOG_HIBERNATE=debug a secas
  # salieron 277 sentencias y CERO valores; los valores solo aparecen con su propia variable.
  # Las tres lineas de abajo estan fijadas a proposito y NO heredan de `org.hibernate`: subir
  # `LOG_HIBERNATE` a debug para diagnosticar una consulta ya no arrastra, de propina, los datos.
  level:
    root: info
    org.hibernate: ${LOG_HIBERNATE:info}
    org.hibernate.orm.jdbc.bind: ${LOG_HIBERNATE_PARAMETROS:info}
    org.hibernate.orm.jdbc.extract: ${LOG_HIBERNATE_PARAMETROS:info}
    org.hibernate.internal.util.EntityPrinter: ${LOG_HIBERNATE_ENTIDADES:info}
    org.springframework: info
    # R4-01 (`bitacora/5-E3-R4-cierre.md`). Spring Boot le pone categoria de aviso a este resolutor
    # (`WebMvcAutoConfiguration.EnableWebMvcConfiguration.createExceptionResolver`), asi que por cada
    # excepcion que atiende un `@ControllerAdvice` escribe un WARN `Resolved [<excepcion>]` con el
    # `toString()` ENTERO de la excepcion. Para una `MethodArgumentNotValidException` eso incluye el
    # valor rechazado -o sea, la contrasena que la clienta acaba de teclear-, y sale con la
    # configuracion de fabrica: era la SEGUNDA de las dos lineas del hallazgo, y la que no se arregla
    # tocando ningun manejador. No se puede filtrar por tipo de excepcion, asi que la linea se apaga
    # y el diagnostico lo da cada manejador con lo que puede decir sin valores: los nombres de los
    # campos en `core/error/InternalExceptionHandler.kt` y la clase y el origen del fallo en las redes
    # finales de `product/account` y `product/invitations`.
    # LOG_EXCEPCIONES_RESUELTAS=warn la vuelve a encender -y vuelve a volcar valores-: solo en
    # desarrollo, nunca por defecto.
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ${LOG_EXCEPCIONES_RESUELTAS:error}
# --- Modulo product (fase 5, bloque 5-0c; ver diseno/_12c-modulo-product.md y ADR-5-0C-01) ---
# Estas variables las consumen E4 (pagos: producto.pagos.*) y E3 (cuenta y marca: producto.correo.* y
# producto.contacto.*); un despliegue real las debe traer del ENTORNO, nunca escritas aqui en claro.
# Todo lo sensible nace VACIO: vacio significa "funcion desactivada", no "usa el valor de siempre".
# Se leen con @ConfigurationProperties (modules/product/ProductPropertiesConfig.kt), asi que anadir
# logica de pagos o de marca NO obliga a volver a tocar este fichero.
# FRONTEND_URL no se toca: ya existe como app.frontend.url y se reutiliza tal cual.
producto:
  pagos:
    stripe:
      # Secretos de Stripe. Sin clave-secreta no se cobra; es decision de E4 fallar al arrancar o
      # degradar la compra, pero nunca cobrar contra una clave adivinada.
      clave-secreta: ${STRIPE_SECRET_KEY:}
      secreto-webhook: ${STRIPE_WEBHOOK_SECRET:}
      moneda: ${STRIPE_MONEDA:MXN}
  correo:
    # Remitente de marca de los correos del producto nuevo (no es el transporte: eso es core/email).
    remitente: ${MAIL_FROM:}
    remitente-nombre: "${MAIL_FROM_NOMBRE:Lino & Sello}"
    responder-a: ${MAIL_RESPONDER_A:}
  contacto:
    # Datos que la interfaz pinta en pie de pagina, ayuda y avisos legales.
    # WhatsApp es solo click-to-chat (wa.me), sin API de WhatsApp Business (ADR-DUENO-02).
    correo: ${CONTACTO_CORREO:}
    whatsapp: ${CONTACTO_WHATSAPP:}
    soporte: ${SOPORTE_CORREO:}
